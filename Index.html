<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.07);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --liquid-tint: rgba(162, 210, 255, 0.12);
      --liquid-glow: rgba(162, 210, 255, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12), transparent 60%);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========== Avatar Logo ========== */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(22, 33, 58, 0.6) 0%, rgba(11, 15, 23, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .avatar svg {
      width: 52px;
      height: 52px;
    }

    .handle {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      direction: ltr;
    }

    .tagline {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ========== Link Cards & iOS Glass ========== */
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .link-card:hover,
    .link-card:focus-visible {
      background: var(--liquid-tint);
      border-color: rgba(162, 210, 255, 0.3);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 25px var(--liquid-glow);
    }

    .link-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .icon-box svg {
      width: 20px;
      height: 20px;
      fill: var(--text-main);
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      z-index: 2;
    }

    .arrow {
      color: var(--text-muted);
      font-size: 18px;
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .link-card:hover .arrow {
      transform: translateX(-4px);
      color: var(--text-main);
    }

    /* ========== Dropdown Accordion ========== */
    .dropdown-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dropdown-chevron {
      transition: transform 0.3s ease;
    }

    .dropdown-container.open .dropdown-chevron {
      transform: rotate(-90deg);
    }

    .dropdown-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 10px;
    }

    .dropdown-container.open .dropdown-content {
      max-height: 500px;
    }

    .sub-card {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 14px;
      padding: 12px 16px;
      border-color: rgba(255, 255, 255, 0.05);
    }

    /* ========== Ripple Wave Effect ========== */
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(162, 210, 255, 0.35);
      backdrop-filter: blur(8px);
      transform: scale(0);
      animation: ripple 0.55s linear;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    footer {
      margin-top: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>

<script>
  // رابط الإعلان المباشر الخاص بك من Monetag
  const adUrl = "https://omg10.com/4/11578028"; 
  let adSeen = sessionStorage.getItem('adSeen') === 'true';

  // فتح وإغلاق القائمة المنسدلة
  const dropdownTrigger = document.getElementById('dropdownTrigger');
  const appsDropdown = document.getElementById('appsDropdown');

  dropdownTrigger.addEventListener('click', function(e) {
    appsDropdown.classList.toggle('open');
  });

  // التحكم بإعلانات التحميل
  const downloadButtons = document.querySelectorAll('.download-btn');

  downloadButtons.forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      const fileUrl = btn.getAttribute('data-file-url');

      if (!adSeen) {
        adSeen = true;
        sessionStorage.setItem('adSeen', 'true');
        window.open(adUrl, '_blank', 'noopener,noreferrer');
        
        const titleEl = btn.querySelector('.title');
        if (titleEl && !titleEl.dataset.original) {
          titleEl.dataset.original = titleEl.textContent;
          titleEl.textContent = 'اضغط مرة أخرى للتحميل ⬇';
        }
      } else {
        window.open(fileUrl, '_blank', 'noopener,noreferrer');
      }
    });
  });

  // تأثير الموجة (Ripple Effect)
  document.querySelectorAll('.link-card').forEach(card => {
    card.addEventListener('click', function(e) {
      createRipple(e, this);
    });
  });

  function createRipple(event, element) {
    const circle = document.createElement('span');
    const diameter = Math.max(element.clientWidth, element.clientHeight);
    const radius = diameter / 2;

    const rect = element.getBoundingClientRect();
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${event.clientX - rect.left - radius}px`;
    circle.style.top = `${event.clientY - rect.top - radius}px`;
    circle.classList.add('ripple-effect');

    const existingRipple = element.querySelector('.ripple-effect');
    if (existingRipple) {
      existingRipple.remove();
    }

    element.appendChild(circle);

    setTimeout(() => {
      circle.remove();
    }, 550);
  }
</script>
